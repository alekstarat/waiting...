<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отсчёт до 27 сентября</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #050508;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      animation: float 18s infinite linear;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 900px;
    }

    h1 {
      font-weight: 200;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      letter-spacing: 0.35em;
      margin-bottom: 0.6rem;
      color: #ffffff;
      text-transform: uppercase;
    }

    .subtitle {
      font-weight: 200;
      font-size: 1rem;
      opacity: 0.55;
      margin-bottom: 3.2rem;
      letter-spacing: 0.12em;
      color: #ffffff;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: clamp(1rem, 4vw, 2.2rem);
      flex-wrap: wrap;
      margin-bottom: 2.8rem;
    }

    .unit {
      background: transparent;
      border: none;
      padding: 0.6rem 0.4rem;
      min-width: 90px;
    }

    .number {
      font-weight: 200;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      line-height: 1;
      color: #ffffff;
      letter-spacing: 0.05em;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      opacity: 0.4;
      margin-top: 0.7rem;
      font-weight: 300;
      color: #ffffff;
    }

    .total-seconds {
      font-weight: 200;
      font-size: clamp(0.95rem, 2.8vw, 1.25rem);
      color: #ffffff;
      opacity: 0.6;
      margin-top: 0.5rem;
      letter-spacing: 0.08em;
    }

    .total-seconds span {
      font-weight: 300;
      opacity: 1;
    }

    .message {
      margin-top: 2.8rem;
      font-size: 3.4rem;
      line-height: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pill {
      display: inline-block;
      cursor: pointer;
      animation: pill-float 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.3));
      user-select: none;
      transition: transform 0.2s ease;
    }

    .pill:hover {
      transform: scale(1.15);
    }

    .pill:active {
      transform: scale(0.95);
    }

    @keyframes pill-float {
      0%, 100% {
        transform: translateY(0) rotate(-8deg) scale(1);
      }
      25% {
        transform: translateY(-12px) rotate(5deg) scale(1.1);
      }
      50% {
        transform: translateY(-3px) rotate(-4deg) scale(1.03);
      }
      75% {
        transform: translateY(-14px) rotate(7deg) scale(1.12);
      }
    }

    .finished {
      display: none;
      font-weight: 200;
      font-size: 2rem;
      color: #ffffff;
      letter-spacing: 0.15em;
      animation: fade-pulse 2s ease-in-out infinite;
    }

    @keyframes fade-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== DISCO OVERLAY ===== */
    .disco-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(5, 5, 8, 0.92);
      backdrop-filter: blur(6px);
      cursor: pointer;
    }

    .disco-overlay.active {
      display: flex;
    }

    .disco-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: default;
    }

    /* Soft dim light behind the PNG (follows shape via drop-shadow) */
    .disco-photo {
      display: block;
      max-width: min(340px, 82vw);
      max-height: min(420px, 75vh);
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      /* Caramelldansen + soft backlight + RGB outline that follows PNG alpha */
      animation: caramell 0.55s ease-in-out infinite, rgb-glow 2.8s linear infinite;
      transform-origin: center bottom;
      filter:
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.18))
        drop-shadow(0 0 35px rgba(255, 255, 255, 0.08));
    }

    /* Classic Caramelldansen side-to-side + bounce */
    @keyframes caramell {
      0%   { transform: translateX(-18px) rotate(-6deg) scaleY(1); }
      25%  { transform: translateX(0)     rotate(0deg)  scaleY(0.92); }
      50%  { transform: translateX(18px)  rotate(6deg)  scaleY(1); }
      75%  { transform: translateX(0)     rotate(0deg)  scaleY(0.92); }
      100% { transform: translateX(-18px) rotate(-6deg) scaleY(1); }
    }

    /* RGB neon that follows the shape of the PNG (via animated drop-shadow) */
    @keyframes rgb-glow {
      0% {
        filter:
          drop-shadow(0 0 6px #ff0066)
          drop-shadow(0 0 14px #ff0066)
          drop-shadow(0 0 22px rgba(255, 0, 102, 0.45))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      }
      16% {
        filter:
          drop-shadow(0 0 6px #ff9900)
          drop-shadow(0 0 14px #ff9900)
          drop-shadow(0 0 22px rgba(255, 153, 0, 0.45))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      }
      33% {
        filter:
          drop-shadow(0 0 6px #ffff00)
          drop-shadow(0 0 14px #ffff00)
          drop-shadow(0 0 22px rgba(255, 255, 0, 0.4))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      }
      50% {
        filter:
          drop-shadow(0 0 6px #00ff66)
          drop-shadow(0 0 14px #00ff66)
          drop-shadow(0 0 22px rgba(0, 255, 102, 0.45))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      }
      66% {
        filter:
          drop-shadow(0 0 6px #00ccff)
          drop-shadow(0 0 14px #00ccff)
          drop-shadow(0 0 22px rgba(0, 204, 255, 0.45))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      }
      83% {
        filter:
          drop-shadow(0 0 6px #cc00ff)
          drop-shadow(0 0 14px #cc00ff)
          drop-shadow(0 0 22px rgba(204, 0, 255, 0.45))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      }
      100% {
        filter:
          drop-shadow(0 0 6px #ff0066)
          drop-shadow(0 0 14px #ff0066)
          drop-shadow(0 0 22px rgba(255, 0, 102, 0.45))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.12));
      }
    }

    .disco-hint {
      margin-top: 28px;
      font-size: 0.75rem;
      font-weight: 200;
      opacity: 0.45;
      letter-spacing: 0.1em;
      color: #fff;
    }

    @media (max-width: 600px) {
      .unit {
        min-width: 70px;
      }
      .label {
        font-size: 0.6rem;
      }
      h1 {
        letter-spacing: 0.2em;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <p class="subtitle">до возвращения 💞🧸❣Дарины❤️‍🔥🌌💋</p>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="number" id="days">00</div>
        <div class="label">дней</div>
      </div>
      <div class="unit">
        <div class="number" id="hours">00</div>
        <div class="label">часов</div>
      </div>
      <div class="unit">
        <div class="number" id="minutes">00</div>
        <div class="label">минут</div>
      </div>
      <div class="unit">
        <div class="number" id="seconds">00</div>
        <div class="label">секунд</div>
      </div>
    </div>

    <div class="total-seconds">
      Всего секунд: <span id="total-sec">0</span>
    </div>

    <div class="message" id="message">
      <span class="pill" id="pill" title="Нажми!">💊</span>
    </div>
    <div class="finished" id="finished">Время пришло</div>
  </div>

  <div class="disco-overlay" id="discoOverlay">
    <div class="disco-wrapper" onclick="event.stopPropagation()">
      <img
        class="disco-photo"
        id="discoPhoto"
        src="https://github.com/user-attachments/assets/cdbca803-0632-428e-994c-a1e58fbbf6a8"
        alt="disco"
      >
    </div>
  </div>

  <script>
    // Target: 27 September 2026, 11:00:00 UTC+3
    const targetDate = new Date('2026-09-27T11:00:00+03:00').getTime();

    function updateCountdown() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('total-sec').parentElement.style.display = 'none';
        document.getElementById('message').style.display = 'none';
        document.getElementById('finished').style.display = 'block';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
      document.getElementById('total-sec').textContent = totalSeconds.toLocaleString('ru-RU');
    }

    // Particles
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 55; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 18 + 's';
        p.style.animationDuration = (12 + Math.random() * 20) + 's';
        const size = 1 + Math.random() * 2.5;
        p.style.width = p.style.height = size + 'px';
        p.style.opacity = 0.3 + Math.random() * 0.5;
        container.appendChild(p);
      }
    }

    // Disco logic
    const pill = document.getElementById('pill');
    const overlay = document.getElementById('discoOverlay');

    pill.addEventListener('click', () => {
      overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
      overlay.classList.remove('active');
    });

    createParticles();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
